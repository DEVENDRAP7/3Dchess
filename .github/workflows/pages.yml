# Publishes the game to GitHub Pages. It is a static site with no build step —
# the workflow just uploads the repository as-is.
name: Deploy to GitHub Pages

on:
  push:
    # The repository started out empty, so the development branch is currently
    # the default. Both are listed so the site deploys either way.
    branches:
      - main
      - claude/3d-mobile-chess-game-bspepc
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
